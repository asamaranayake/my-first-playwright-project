# ============================================================
# GitHub Actions: Basic Playwright Workflow
# ============================================================
# This workflow runs Playwright tests on:
#   - Push to main/master branches
#   - Pull requests targeting main/master
#
# It uploads the HTML report as an artifact for download.
# ============================================================

name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
      env:
        CI: 'true'

    # Always upload the report — even if tests fail
    - name: Upload HTML Report
      uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
