# ============================================================
# GitHub Actions: Manual Playwright Workflow (Single Run)
# ============================================================
# This workflow does NOT run on push or pull_request.
# Trigger it yourself from the "Actions" tab ("Run workflow")
# or let it run on the daily schedule below.
#
# Inputs let you target a tag (e.g. @smoke), a specific project,
# or a free-form grep pattern, just like running locally:
#   npx playwright test --grep @smoke --project=chromium
# ============================================================

name: Playwright Tests (Manual)

on:
  # Run manually from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      grep:
        description: 'Tag/pattern to filter tests (e.g. @smoke, @regression). Leave empty to run all.'
        required: false
        default: ''
      project:
        description: 'Playwright project to run (e.g. chromium). Leave empty for default.'
        required: false
        default: ''
      headed:
        description: 'Run in headed mode'
        required: false
        default: false
        type: boolean

  # Run automatically on a schedule (daily at 02:00 UTC)
  schedule:
    - cron: '0 2 * * *'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: |
        npx playwright test \
          ${{ inputs.grep != '' && format('--grep "{0}"', inputs.grep) || '' }} \
          ${{ inputs.project != '' && format('--project={0}', inputs.project) || '' }} \
          ${{ inputs.headed == true && '--headed' || '' }}
      env:
        CI: 'true'

    # Always upload the report — even if tests fail
    - name: Upload HTML Report
      uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
